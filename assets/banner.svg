<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Retina Disease Detection</title>
  <defs>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="240" rx="18" ry="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect x="0" y="0" width="1200" height="240" fill="#f4f7fb"/>
    <rect x="0" y="0" width="1200" height="8" fill="#0f2a44"/>
  </g>
  <text x="600" y="72" text-anchor="middle" fill="#0f2a44" font-size="38" font-weight="700">Retina Disease Detection</text>
  <text x="600" y="106" text-anchor="middle" fill="#5b6b7f" font-size="18">Binary disease-risk and multilabel fundus screening on RFMiD · CNNs, ViT-L ensembles, Grad-CAM</text>
  <rect x="30" y="146" width="196" height="64" rx="12" ry="12" fill="#ffffff" stroke="#4285f4" stroke-width="2"/>
  <text x="128" y="174" text-anchor="middle" fill="#0f2a44" font-size="16" font-weight="700">RFMiD fundus</text>
  <text x="128" y="194" text-anchor="middle" fill="#5b6b7f" font-size="12">train / val / test splits</text>
  <line x1="231" y1="178" x2="253" y2="178" stroke="#5b6b7f" stroke-width="2"/>
  <polygon points="252,172 261,178 252,184" fill="#5b6b7f"/>
  <rect x="266" y="146" width="196" height="64" rx="12" ry="12" fill="#ffffff" stroke="#34a853" stroke-width="2"/>
  <text x="364" y="174" text-anchor="middle" fill="#0f2a44" font-size="16" font-weight="700">Preprocessing</text>
  <text x="364" y="194" text-anchor="middle" fill="#5b6b7f" font-size="12">letterbox · taxonomies</text>
  <line x1="467" y1="178" x2="489" y2="178" stroke="#5b6b7f" stroke-width="2"/>
  <polygon points="488,172 497,178 488,184" fill="#5b6b7f"/>
  <rect x="502" y="146" width="196" height="64" rx="12" ry="12" fill="#ffffff" stroke="#fbbc04" stroke-width="2"/>
  <text x="600" y="174" text-anchor="middle" fill="#0f2a44" font-size="16" font-weight="700">CNN &amp; ViT-L/14</text>
  <text x="600" y="194" text-anchor="middle" fill="#5b6b7f" font-size="12">ResNet · DINOv2 · RETFound</text>
  <line x1="703" y1="178" x2="725" y2="178" stroke="#5b6b7f" stroke-width="2"/>
  <polygon points="724,172 733,178 724,184" fill="#5b6b7f"/>
  <rect x="738" y="146" width="196" height="64" rx="12" ry="12" fill="#ffffff" stroke="#ea4335" stroke-width="2"/>
  <text x="836" y="174" text-anchor="middle" fill="#0f2a44" font-size="16" font-weight="700">TTA + ensembles</text>
  <text x="836" y="194" text-anchor="middle" fill="#5b6b7f" font-size="12">probability averaging</text>
  <line x1="939" y1="178" x2="961" y2="178" stroke="#5b6b7f" stroke-width="2"/>
  <polygon points="960,172 969,178 960,184" fill="#5b6b7f"/>
  <rect x="974" y="146" width="196" height="64" rx="12" ry="12" fill="#ffffff" stroke="#8e44ad" stroke-width="2"/>
  <text x="1072" y="174" text-anchor="middle" fill="#0f2a44" font-size="16" font-weight="700">Val-only thresholds</text>
  <text x="1072" y="194" text-anchor="middle" fill="#5b6b7f" font-size="12">recall · F2 · Grad-CAM</text>
  <rect x="0.5" y="0.5" width="1199" height="239" rx="18" ry="18" fill="none" stroke="#d8e0ea" stroke-width="1"/>
</svg>
