[theme]
# Paleta "instrumento clínico": fondo casi negro (las retinas destacan sobre oscuro),
# acento verde azulado. Contrastes: texto/fondo ~15:1, acento/fondo ~8:1 (WCAG AA/AAA).
base = "dark"
primaryColor = "#3FB8AF"
backgroundColor = "#0F1419"
secondaryBackgroundColor = "#171E26"
textColor = "#E6EDF3"
font = "sans serif"

[server]
headless = true
maxUploadSize = 50

[browser]
gatherUsageStats = false
