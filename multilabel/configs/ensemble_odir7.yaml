# Deployed odir7 ensemble (mean of member probabilities). Mirrors checkpoints/final_20261030/manifest.json,
# which is produced by evaluation/final_comparison/04_build_manifest.py and is what app/ loads.
labels: [N, D, G, C, A, M, O]
members:
  - {run: vit_residual_attn_odir7_v2_518, img_size: 518, config: configs/vit_residual_attn_odir7_v2_518.yaml}
  - {run: vit_residual_attn_odir7_v2, img_size: 392, config: configs/vit_residual_attn_odir7_v2.yaml}
  - {run: vit_residual_attn_odir7_v3fundus, img_size: 392, config: configs/vit_residual_attn_odir7_v3fundus.yaml}
preprocessing: {color: RGB, resize: bicubic (no letterbox), scale: 1/255, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
threshold_criterion: fbeta2 on VAL (grid 0.01..0.99)
thresholds: [0.14, 0.26, 0.2, 0.21, 0.19, 0.33, 0.38]
